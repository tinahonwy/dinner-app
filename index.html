<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>一起漂漂亮亮</title>
<link rel="icon" type="image/png" href="./favicon.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="./favicon.png?v=3">
<meta name="apple-mobile-web-app-title" content="一起漂漂亮亮">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<style>
  :root{
    --parchment:#F3EDE2;
    --surface:#FFFDF9;
    --ink:#2B2320;
    --ink-soft:#6B6058;
    --line:#E3DACB;
    --coral:#D9663F;
    --coral-deep:#B94F2E;
    --teal:#3E6259;
    --teal-soft:#DCE7E1;
    --blue:#3E7CB1;
    --blue-soft:#DCE9F2;
    --gold:#C99A3E;
    --gold-soft:#F3E6C4;
    --err:#B5432F;
    --shadow: 0 1px 2px rgba(43,35,32,0.04), 0 8px 24px -12px rgba(43,35,32,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    background:var(--parchment);
    color:var(--ink);
    font-family:'IBM Plex Sans TC', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--gold-soft);}
  .num{font-family:'IBM Plex Mono', monospace;}
  h1,h2,h3,.display{font-family:'Fraunces', serif;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  a{color:var(--coral-deep);}

  #root{max-width:560px;margin:0 auto;min-height:100vh;min-height:100svh;position:relative;padding-bottom:calc(120px + env(safe-area-inset-bottom));}

  .topbar{display:flex;align-items:baseline;justify-content:space-between;padding:22px 20px 14px;}
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand .mark{font-size:26px;}
  .brand h1{font-size:21px;font-weight:600;margin:0;letter-spacing:.2px;}
  .brand .tag{font-size:11px;color:var(--ink-soft);letter-spacing:.4px;}
  .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);}
  .who .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);}
  .who button{background:none;border:none;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font-size:12px;padding:0;}
  .profile-trigger{
    display:flex;align-items:center;gap:8px;background:none;border:none;
    color:var(--ink-soft);font-size:13px;font-family:inherit;cursor:pointer;padding:0;
    text-decoration:none !important;
  }
  .profile-trigger:hover{color:var(--coral-deep);}
  .avatar-mini{width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .icon-btn{
    position:relative;background:none;border:none;font-size:26px;cursor:pointer;
    padding:4px 6px;line-height:1;
  }
  .invite-badge{
    position:absolute;top:0px;right:2px;width:11px;height:11px;border-radius:50%;
    background:var(--coral);border:2px solid var(--parchment);
  }
  .friends-section{margin-bottom:18px;}
  .friends-section:last-child{margin-bottom:0;}
  .friends-section-title{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:10px;}
  .invite-row{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:8px;
  }
  .invite-actions{display:flex;gap:6px;flex-shrink:0;}
  .btn-accept{background:var(--teal);color:#fff;border:none;border-radius:16px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;}
  .btn-decline{background:none;color:var(--ink-soft);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:12px;cursor:pointer;}
  .friend-row{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--line);}
  .friend-row:last-child{border-bottom:none;}
  .friend-row-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .friend-remove{background:none;border:none;color:#C7B9AC;font-size:11.5px;cursor:pointer;text-decoration:underline;flex-shrink:0;}
  .friend-remove:hover{color:var(--err);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(43,35,32,.45);z-index:200;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-card{
    background:var(--surface);border-radius:20px;padding:22px;
    max-width:360px;width:100%;box-shadow:var(--shadow);
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h3{margin:0;font-size:18px;font-weight:600;color:var(--ink);}
  .modal-close{background:none;border:none;font-size:16px;color:var(--ink-soft);cursor:pointer;padding:2px 6px;}
  .modal-close:hover{color:var(--coral-deep);}
  .avatar-edit{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px;}
  .avatar-preview{
    width:88px;height:88px;border-radius:50%;background:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-size:30px;font-weight:700;color:#8A6A1E;font-family:'Fraunces',serif;
  }
  .avatar-preview img{width:100%;height:100%;object-fit:cover;}
  .avatar-edit .btn-ghost{width:auto;padding:6px 4px;}
  .color-picker{display:flex;flex-wrap:wrap;gap:10px;padding:2px 0;}
  .color-swatch{
    width:34px;height:34px;border-radius:50%;border:2px solid transparent;
    cursor:pointer;padding:0;position:relative;transition:transform .1s;
  }
  .color-swatch:active{transform:scale(0.92);}
  .color-swatch.selected{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink);}
  .color-swatch.taken{opacity:.25;cursor:not-allowed;position:relative;}
  .color-swatch.taken::after{
    content:'';position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(45deg,transparent 46%,#2B2320 46%,#2B2320 54%,transparent 54%);
  }

  .auth-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;max-width:420px;margin:0 auto;}
  .auth-hero{margin-bottom:28px;}
  .auth-hero .eyebrow{font-size:12px;letter-spacing:2px;color:var(--coral-deep);font-weight:600;text-transform:uppercase;margin-bottom:10px;}
  .auth-hero h1{font-size:34px;line-height:1.15;margin:0 0 8px;font-weight:600;}
  .auth-hero p{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:500;}
  .field input, .field select{width:100%;padding:12px 13px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:15px;color:var(--ink);transition:border-color .15s;}
  .field input:focus, .field select:focus{outline:none;border-color:var(--coral);}
  .btn{width:100%;padding:13px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s, opacity .15s;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--coral);color:#fff;}
  .btn-primary:hover{background:var(--coral-deep);}
  .btn-ghost{background:transparent;color:var(--ink-soft);text-decoration:underline;padding:8px;font-weight:500;font-size:13.5px;}
  .auth-toggle{text-align:center;margin-top:16px;font-size:13.5px;color:var(--ink-soft);}
  .auth-toggle a{cursor:pointer;font-weight:600;}
  .auth-err{background:#FBEAE5;border:1px solid #EFC3B4;color:var(--err);font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px;line-height:1.5;}
  .auth-ok{background:var(--teal-soft);border:1px solid #B7CFC5;color:var(--teal);font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px;line-height:1.5;}

  .tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:50;padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-inner{max-width:560px;width:100%;display:flex;}
  .tab{flex:1;padding:12px 4px 10px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);font-size:11.5px;font-weight:500;}
  .tab .ic{font-size:19px;}
  .tab.active{color:var(--coral-deep);}

  .page{padding:6px 20px 20px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .section-title{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin:22px 0 10px;}
  .section-title:first-child{margin-top:4px;}

  .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px;box-shadow:var(--shadow);}
  .seg button{flex:1;border:none;background:none;padding:10px 4px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .seg button .ic{font-size:17px;}
  .seg button.active{background:var(--coral);color:#fff;}
  .seg button.active.type-water{background:var(--blue);}
  .seg button.active.type-exercise{background:var(--gold);}

  .form-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0;}
  .grid2 > *{min-width:0;}
  .grid3 > *{min-width:0;}
  @media (max-width:430px){
    .grid2{grid-template-columns:1fr;}
  }
  .date-wrap{position:relative;overflow:hidden;border-radius:10px;border:1.5px solid var(--line);background:#fff;}
  .date-wrap input[type=date]{
    border:none;background:transparent;display:block;width:100%;min-width:150px;
    padding:11px 8px;font-size:14px;color:var(--ink);box-sizing:border-box;
  }
  .date-wrap input[type=date]:focus{outline:none;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .field.compact{margin-bottom:12px;}
  .field.compact label{font-size:11.5px;}
  .field.compact input, .field.compact select{padding:10px 11px;font-size:14px;}
  textarea{width:100%;padding:12px 13px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:15px;color:var(--ink);resize:vertical;min-height:52px;}
  textarea:focus{outline:none;border-color:var(--coral);}
  .history-toggle{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--teal-soft);color:var(--teal);border:none;
    font-size:14px;font-weight:600;border-radius:20px;
    cursor:pointer;padding:9px 16px;margin-top:10px;text-decoration:none;
  }
  .history-toggle:active{transform:scale(0.97);}
  .history-toggle:hover{background:var(--teal);color:#fff;}
  .history-panel{
    margin-top:8px;max-height:220px;overflow-y:auto;border:1.5px solid var(--line);
    border-radius:12px;background:#FFFCF7;padding:4px;
  }
  .history-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);
    padding:9px 8px;cursor:pointer;font-size:13px;color:var(--ink);
  }
  .history-item:last-child{border-bottom:none;}
  .history-item:hover{background:var(--parchment);border-radius:8px;}
  .history-item-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .history-item-meta{flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);}
  .history-empty{font-size:12.5px;color:var(--ink-soft);text-align:center;padding:14px 6px;}

  .photo-box{border:1.5px dashed var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer;background:#FFFCF7;position:relative;overflow:hidden;}
  .photo-box.has-img{border-style:solid;padding:0;}
  .photo-box img{width:100%;max-height:220px;object-fit:cover;display:block;border-radius:12px;}
  .photo-box .placeholder{color:var(--ink-soft);font-size:13px;padding:16px 0;}
  .photo-box .placeholder .ic{font-size:26px;display:block;margin-bottom:6px;}
  .photo-remove{position:absolute;top:8px;right:8px;background:rgba(43,35,32,.65);color:#fff;border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:14px;}

  .submit-row{margin-top:16px;}
  .toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-size:13.5px;box-shadow:var(--shadow);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .water-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .water-chip{background:var(--blue-soft);border:1.5px solid transparent;border-radius:14px;padding:16px 6px;text-align:center;cursor:pointer;transition:transform .1s;}
  .water-chip:active{transform:scale(0.96);}
  .water-chip .amt{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:var(--blue);}
  .water-chip .u{font-size:10.5px;color:var(--ink-soft);}

  .day-group{margin-bottom:18px;}
  .history-filter{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .history-filter .date-wrap{box-shadow:var(--shadow);}
  .filter-clear{
    border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);
    padding:10px 14px;border-radius:10px;font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .filter-clear:hover{color:var(--coral-deep);border-color:var(--coral);}
  .day-label{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:8px;letter-spacing:.3px;}
  .entry-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;gap:12px;}
  .entry-thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--teal-soft);}
  .entry-thumb.empty{display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--teal);}
  .entry-thumb.type-water{background:var(--blue-soft);color:var(--blue);}
  .entry-thumb.type-exercise{background:var(--gold-soft);color:#8A6A1E;}
  .entry-body{flex:1;min-width:0;}
  .entry-top{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--gold-soft);color:#8A6A1E;}
  .type-tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;}
  .type-tag.meal{background:#FBE6DB;color:var(--coral-deep);}
  .type-tag.water{background:var(--blue-soft);color:var(--blue);}
  .type-tag.exercise{background:var(--gold-soft);color:#8A6A1E;}
  .type-tag.qty{background:var(--parchment);color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .entry-dinner{font-size:14.5px;font-weight:500;margin:4px 0 6px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .entry-stats{display:flex;flex-wrap:wrap;gap:8px;font-size:11.5px;color:var(--ink-soft);}
  .entry-stats span{background:var(--parchment);padding:2px 8px;border-radius:8px;}
  .entry-stats b{color:var(--ink);font-family:'IBM Plex Mono',monospace;}
  .entry-actions{display:flex;justify-content:flex-end;margin-top:6px;}
  .del-btn{background:none;border:none;color:#C7B9AC;font-size:11.5px;cursor:pointer;text-decoration:underline;}
  .edit-btn{background:none;border:none;color:var(--teal);font-size:11.5px;cursor:pointer;text-decoration:underline;margin-right:14px;}
  .edit-btn:hover{color:var(--coral-deep);}
  .editing-banner{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--gold-soft);color:#8A6A1E;border:1px solid #E4CB8E;
    border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px;
  }
  .editing-banner button{
    background:none;border:1.5px solid #8A6A1E;color:#8A6A1E;border-radius:20px;
    padding:4px 12px;font-size:11.5px;font-weight:600;cursor:pointer;flex-shrink:0;
  }
  .seg button[disabled]{opacity:.4;cursor:not-allowed;}
  .del-btn:hover{color:var(--err);}
  .empty-state{text-align:center;color:var(--ink-soft);font-size:13.5px;padding:40px 10px;line-height:1.7;}
  .empty-state .ic{font-size:34px;display:block;margin-bottom:10px;}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;box-shadow:var(--shadow);}
  .stat-card .who-name{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:2px;}
  .stat-card .big{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;color:var(--coral-deep);}
  .stat-card .lbl{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}

  .bar-block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 6px;box-shadow:var(--shadow);margin-bottom:14px;}
  .bar-block h3{font-size:14px;margin:0 0 12px;font-weight:600;}
  .ref-note{font-size:10.5px;color:var(--ink-soft);font-weight:400;text-transform:none;letter-spacing:0;margin-left:4px;}
  .bar-row{margin-bottom:12px;}
  .bar-row .bar-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .bar-row .bar-head .name{color:var(--ink-soft);font-weight:500;}
  .bar-row .bar-head .val{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .bar-track{background:var(--parchment);border-radius:8px;height:10px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;border-radius:8px;transition:width .6s ease;}
  .bar-fill.empty{background:repeating-linear-gradient(135deg,var(--line),var(--line) 4px,transparent 4px,transparent 8px) !important;width:100% !important;opacity:.5;}
  .bar-ref{position:absolute;top:-2px;bottom:-2px;width:0;border-left:2px dashed #B0A493;z-index:2;}
  .dash-range{margin-bottom:14px;}
  .dash-range button{padding:9px 4px;font-size:12.5px;}
  .person-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .person-filter .chip{
    border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);
    padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .person-filter .chip.active{color:#fff;border-color:transparent;}
  .person-filter .chip[data-person=""].active{background:var(--ink);}

  .plate-row{display:flex;justify-content:center;gap:22px;margin:18px 0 8px;flex-wrap:wrap;}
  .plate{position:relative;width:84px;height:84px;}
  .plate svg{transform:rotate(-90deg);}
  .plate-name{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:10.5px;color:var(--ink-soft);font-weight:600;}
  .plate-name b{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);font-weight:600;}

  .ex-groups{margin-bottom:10px;}
  .ex-group{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
  .ex-group:last-child{border-bottom:none;}
  .ex-group-date{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:12.5px;width:36px;flex-shrink:0;padding-top:2px;}
  .ex-group-rows{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;}
  .ex-row{display:flex;align-items:center;gap:9px;font-size:12.5px;}
  .ex-type{flex:1;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ex-min{color:var(--gold);font-weight:600;flex-shrink:0;}
  .ex-empty{color:var(--ink-soft);font-size:12.5px;padding:14px 2px;text-align:center;}

  /* ---------- Board (留言板) ---------- */

<script>
const firebaseConfig = {

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const MEAL_TYPES = ["早餐","午餐","晚餐","點心"];
const EXERCISE_TYPES = ["跑步","重訓","瑜伽","游泳","騎車","快走/散步","球類運動","居家運動","其他"];

const DEFAULT_AVATAR = "./favicon.png";
const PALETTE = ["#D9663F","#3E6259","#C99A3E","#7D5BA6","#3E7CB1","#B5432F","#4C8C6B","#B65A82"];
function nameColor(name){
  const u = allUsers.find(x=>x.name===name && x.color);
  if(u) return u.color;
  let h = 0;
  for(let i=0;i<(name||'').length;i++){ h = (h*31 + name.charCodeAt(i)) % 997; }
  return PALETTE[h % PALETTE.length];
}
function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
async function pickAvailableColor(excludeUid){
  try{
    const snap = await db.collection('users').get();
    const taken = new Set();
    snap.forEach(d=>{
      if(d.id===excludeUid) return;
      if(d.data().color) taken.add(d.data().color);
    });
    for(const c of PALETTE){ if(!taken.has(c)) return c; }
  }catch(e){ console.error(e); }
  return PALETTE[0];
}

let currentUser = null;
let currentProfile = null;
let allEntries = [];
let allUsers = [];

let historyFilterPerson = '';

let sentInvites = [];

}

function esc(s){return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let unsubProfile = null;

auth.onAuthStateChanged(async (user)=>{

  }
});

function listenProfile(user){
  if(unsubProfile) unsubProfile();
  unsubProfile = db.collection('users').doc(user.uid).onSnapshot(doc=>{
    currentProfile = doc.exists ? doc.data() : {name:'未命名', email:user.email};
    if(currentProfile && !currentProfile.color){
      pickAvailableColor(user.uid).then(color=>{
        db.collection('users').doc(user.uid).update({color}).catch(()=>{});
      });
    }
    renderApp();
  }, err=>{
    console.error(err);
    currentProfile = {name:'未命名', email:user.email};
    renderApp();
  });
}


async function ensureLegacyFriendsSeeded(){
  try{
    const snapRef = db.collection('meta').doc('legacyUserIds');
    let legacyIds;
    const snapDoc = await snapRef.get();
    if(snapDoc.exists){
      legacyIds = snapDoc.data().uids || [];
    } else {
      const usersSnap = await db.collection('users').get();
      legacyIds = usersSnap.docs.map(d=>d.id);
      await snapRef.set({uids: legacyIds, at: firebase.firestore.FieldValue.serverTimestamp()});
    }
    if(!legacyIds.includes(currentUser.uid)) return; // 不是最初那批人，不自動加好友
    const flagRef = db.collection('meta').doc('legacySeedDone_' + currentUser.uid);
    const flagDoc = await flagRef.get();
    if(flagDoc.exists) return;
    const others = legacyIds.filter(uid=>uid!==currentUser.uid);
    if(others.length>0){
      const batch = db.batch();
      others.forEach(otherUid=>{
        batch.set(db.collection('users').doc(currentUser.uid).collection('friends').doc(otherUid), {since: firebase.firestore.FieldValue.serverTimestamp()});
        batch.set(db.collection('users').doc(otherUid).collection('friends').doc(currentUser.uid), {since: firebase.firestore.FieldValue.serverTimestamp()});
      });
      await batch.commit();
    }
    await flagRef.set({done:true, at: firebase.firestore.FieldValue.serverTimestamp()});
  }catch(e){ console.error('legacy friend seed failed', e); }
}

function listenFriends(){
  if(unsubFriends) unsubFriends();
  unsubFriends = db.collection('users').doc(currentUser.uid).collection('friends')
    .onSnapshot(snap=>{
      myFriends = new Set(snap.docs.map(d=>d.id));
      renderApp();
    }, err=>console.error(err));
}

function listenInvites(){
  if(unsubInvites) unsubInvites();
  if(!currentUser.email) return;
  unsubInvites = db.collection('invites')
    .where('toEmail','==', currentUser.email)
    .where('status','==','pending')
    .onSnapshot(snap=>{
      pendingInvitesToMe = snap.docs.map(d=>({id:d.id, ...d.data()}));
      const badge = document.getElementById('inviteBadge');
      if(badge) badge.classList.toggle('hidden', pendingInvitesToMe.length===0);
      const overlay = document.getElementById('friendsModalOverlay');
      if(overlay) renderFriendsModalBody();
    }, err=>console.error(err));
}

function listenSentInvites(){
  if(unsubSentInvites) unsubSentInvites();
  unsubSentInvites = db.collection('invites')
    .where('fromUid','==', currentUser.uid)
    .where('status','==','pending')
    .onSnapshot(snap=>{
      sentInvites = snap.docs.map(d=>({id:d.id, ...d.data()}));
      const overlay = document.getElementById('friendsModalOverlay');
      if(overlay) renderFriendsModalBody();
    }, err=>console.error(err));
}

function listenPosts(){
  if(unsubPosts) unsubPosts();
  unsubPosts = db.collection('posts').orderBy('createdAt','desc').limit(200)

      allPosts = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(activeTab==='board'){
        const feedEl = document.getElementById('postFeed');
        if(feedEl) renderPostFeed(); else renderApp();

}

function listenUsers(){
  if(unsubUsers) unsubUsers();
  unsubUsers = db.collection('users').onSnapshot(snap=>{
    allUsers = snap.docs.map(d=>({uid:d.id, ...d.data()}));

  }, err=>console.error(err));
}
function userAvatar(uid){
  const u = allUsers.find(x=>x.uid===uid);
  return u && u.avatar ? u.avatar : DEFAULT_AVATAR;
}

function listenEntries(){
  if(unsubEntries) unsubEntries();
  unsubEntries = db.collection('entries').orderBy('date','desc').limit(400)
    .onSnapshot(snap=>{
      allEntries = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(activeTab==='history') renderHistoryPage();
      else if(activeTab==='dash') renderDashPage();
    }, err=>{
      console.error(err);
      toast('讀取資料時發生問題');
    });
}

function renderAuth(){
  const isReset = authMode==='reset';
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-hero">
        <div class="eyebrow">每天,漂亮一點點</div>
        <h1 class="display">一起漂漂亮亮</h1>
        <p>記下今天吃了什麼、喝了多少水、做了什麼運動。大家共用一份紀錄,隨時同步。</p>
      </div>
      <div class="card">
        <div id="authError"></div>
        ${isReset ? `<p style="font-size:13px;color:var(--ink-soft);margin:0 0 16px;line-height:1.6;">輸入註冊時用的 Email,我們會寄一封重設密碼的信給你。</p>` : ''}
        <div id="registerFields" class="${authMode==='register'?'':'hidden'}">
          <div class="field">
            <label>你是誰？</label>
            <input type="text" id="regName" placeholder="輸入你的名字或暱稱" maxlength="20">
          </div>
          <div class="field">
            <label>邀請碼</label>
            <input type="text" id="regInviteCode" placeholder="輸入邀請碼">
          </div>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field ${isReset?'hidden':''}">
          <label>密碼</label>
          <input type="password" id="authPass" placeholder="至少 6 個字元" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" id="authSubmit">${authMode==='login'?'登入':authMode==='register'?'建立帳號':'寄送重設密碼信'}</button>
        <div class="auth-toggle">
          ${authMode==='login'
            ? `還沒有帳號？<a id="toRegister">建立一個</a> ・ <a id="toReset">忘記密碼？</a>`
            : `已經有帳號了？<a id="toLogin">直接登入</a>`}
        </div>
      </div>
    </div>
  `;
  document.getElementById('authSubmit').onclick = handleAuthSubmit;
  const tr = document.getElementById('toRegister');
  if(tr) tr.onclick = ()=>{authMode='register'; renderAuth();};
  const tl = document.getElementById('toLogin');
  if(tl) tl.onclick = ()=>{authMode='login'; renderAuth();};
  const trs = document.getElementById('toReset');
  if(trs) trs.onclick = ()=>{authMode='reset'; renderAuth();};
}

async function handleAuthSubmit(){
  const email = document.getElementById('authEmail').value.trim();
  const errBox = document.getElementById('authError');
  errBox.innerHTML = '';
  const btn = document.getElementById('authSubmit');
  const btnLabel = authMode==='login'?'登入':authMode==='register'?'建立帳號':'寄送重設密碼信';

  if(authMode==='reset'){
    if(!email){ errBox.innerHTML = `<div class="auth-err">請輸入 Email</div>`; return; }
    btn.disabled = true; btn.textContent = '寄送中…';
    try{
      await auth.sendPasswordResetEmail(email);
      errBox.innerHTML = `<div class="auth-ok">已寄出重設密碼信,請到 ${esc(email)} 收信(記得看一下垃圾郵件匣)。</div>`;
      btn.textContent = '已寄出 ✓';
      setTimeout(()=>{ authMode='login'; renderAuth(); }, 2500);
      return;
    }catch(e){
      const msgMap = {
        'auth/invalid-email':'Email 格式不正確',
        'auth/user-not-found':'找不到這個 Email 的帳號',
      };
      errBox.innerHTML = `<div class="auth-err">${msgMap[e.code] || ('發生錯誤：'+e.message)}</div>`;
      btn.disabled = false; btn.textContent = btnLabel;
      return;
    }
  }

  const pass = document.getElementById('authPass').value;
  if(!email || !pass){
    errBox.innerHTML = `<div class="auth-err">請輸入 Email 和密碼</div>`;
    return;
  }
  btn.disabled = true; btn.textContent = '處理中…';
  try{
    if(authMode==='login'){
      await auth.signInWithEmailAndPassword(email, pass);
    } else {
      const name = document.getElementById('regName').value.trim();
      if(!name){
        errBox.innerHTML = `<div class="auth-err">請輸入你的名字或暱稱</div>`;
        btn.disabled = false; btn.textContent = btnLabel;
        return;
      }
      const inviteCode = document.getElementById('regInviteCode').value.trim();
      if(inviteCode !== INVITE_CODE){
        errBox.innerHTML = `<div class="auth-err">邀請碼不正確</div>`;
        btn.disabled = false; btn.textContent = btnLabel;
        return;
      }
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      const autoColor = await pickAvailableColor(cred.user.uid);
      await db.collection('users').doc(cred.user.uid).set({
        name, email, color: autoColor, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  }catch(e){
    const msgMap = {
      'auth/invalid-email':'Email 格式不正確',
      'auth/user-not-found':'找不到這個帳號,請確認 Email 或改成註冊',
      'auth/wrong-password':'密碼不正確',
      'auth/invalid-credential':'Email 或密碼不正確',
      'auth/email-already-in-use':'這個 Email 已經註冊過了,請改成登入',
      'auth/weak-password':'密碼至少需要 6 個字元',
    };
    errBox.innerHTML = `<div class="auth-err">${msgMap[e.code] || ('發生錯誤：'+e.message)}</div>`;
  }
  btn.disabled = false; btn.textContent = btnLabel;
}

function openProfileModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'profileModalOverlay';
  const initialColor = currentProfile.color || nameColor(currentProfile.name);
  overlay.innerHTML = `
    <div class="modal-card">
      <div class="modal-head">
        <h3 class="display">編輯個人資料</h3>
        <button class="modal-close" id="closeProfileModal">✕</button>
      </div>
      <div class="avatar-edit">
        <div class="avatar-preview" id="avatarPreview">
          ${currentProfile.avatar ? `<img src="${currentProfile.avatar}">` : `<img src="${DEFAULT_AVATAR}">`}
        </div>
        <button class="btn-ghost" id="chooseAvatarBtn">上傳頭像</button>
        <input type="file" id="avatarInput" accept="image/*" style="display:none">
      </div>
      <div class="field">
        <label>使用者名稱</label>
        <input type="text" id="profileNameInput" value="${esc(currentProfile.name||'')}" maxlength="20">
      </div>
      <div class="field">
        <label>代表色</label>
        <div class="color-picker" id="colorPicker">
          ${PALETTE.map(c=>{
            const isMine = c===initialColor;
            return `<button type="button" class="color-swatch ${isMine?'selected':''}" data-color="${c}" style="background:${c}"></button>`;
          }).join('')}
        </div>
      </div>
      <div class="submit-row"><button class="btn btn-primary" id="saveProfileBtn">儲存</button></div>
    </div>
  `;
  document.body.appendChild(overlay);
  let newAvatar = currentProfile.avatar || null;
  let selectedColor = initialColor;

  document.getElementById('closeProfileModal').onclick = ()=>overlay.remove();
  overlay.onclick = (ev)=>{ if(ev.target===overlay) overlay.remove(); };

  document.getElementById('chooseAvatarBtn').onclick = ()=>document.getElementById('avatarInput').click();
  document.getElementById('avatarInput').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 320;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        newAvatar = canvas.toDataURL('image/jpeg', 0.82);
        document.getElementById('avatarPreview').innerHTML = `<img src="${newAvatar}">`;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  document.getElementById('colorPicker').querySelectorAll('.color-swatch:not([disabled])').forEach(sw=>{
    sw.onclick = ()=>{
      selectedColor = sw.dataset.color;
      document.getElementById('colorPicker').querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
    };
  });

  document.getElementById('saveProfileBtn').onclick = async ()=>{
    const btn = document.getElementById('saveProfileBtn');
    const name = document.getElementById('profileNameInput').value.trim();
    if(!name){ toast('請輸入名字'); return; }
    const nameChanged = name !== currentProfile.name;
    btn.disabled = true; btn.textContent = nameChanged ? '同步舊紀錄中…' : '儲存中…';
    try{
      await db.collection('users').doc(currentUser.uid).update({ name, avatar: newAvatar || null, color: selectedColor });
      if(nameChanged){
        await syncNameAcrossData(currentUser.uid, name);
      }
      currentProfile.name = name;
      currentProfile.avatar = newAvatar || null;
      currentProfile.color = selectedColor;
      overlay.remove();
      toast('已更新個人資料 ✨');
      renderApp();
    }catch(e){
      console.error(e);
      toast('更新失敗：'+e.message);
      btn.disabled = false; btn.textContent = '儲存';
    }
  };
}

async function syncNameAcrossData(uid, newName){
  const entriesSnap = await db.collection('entries').where('uid','==',uid).get();
  if(!entriesSnap.empty){
    const batch = db.batch();
    entriesSnap.forEach(doc=>batch.update(doc.ref, {name:newName}));
    await batch.commit();
  }
  const postsSnap = await db.collection('posts').where('uid','==',uid).get();
  if(!postsSnap.empty){
    const batch2 = db.batch();
    postsSnap.forEach(doc=>batch2.update(doc.ref, {name:newName}));
    await batch2.commit();
  }
  try{
    const commentsSnap = await db.collectionGroup('comments').where('uid','==',uid).get();
    if(!commentsSnap.empty){
      const batch3 = db.batch();
      commentsSnap.forEach(doc=>batch3.update(doc.ref, {name:newName}));
      await batch3.commit();
    }
  }catch(e){
    console.error('comment sync failed', e);
  }
}

async function sendInvite(){
  const btn = document.getElementById('sendInviteBtn');
  const input = document.getElementById('inviteEmail');
  const email = input.value.trim().toLowerCase();
  if(!email){ toast('請輸入 Email'); return; }
  if(email === (currentUser.email||'').toLowerCase()){ toast('不能邀請自己'); return; }
  const already = allUsers.find(u=>myFriends.has(u.uid) && (u.email||'').toLowerCase()===email);
  if(already){ toast('你們已經是好友了'); return; }
  const alreadySent = sentInvites.find(inv=>inv.toEmail===email);
  if(alreadySent){ toast('已經邀請過這個 Email 了,還在等待對方接受'); return; }
  btn.disabled = true; btn.textContent = '確認中…';
  try{
    const userSnap = await db.collection('users').where('email','==', email).limit(1).get();
    if(userSnap.empty){
      toast('這個 Email 還沒有註冊帳號,請先請對方註冊再邀請');
      btn.disabled = false; btn.textContent = '送出邀請';
      return;
    }
    btn.textContent = '送出中…';
    await db.collection('invites').add({
      fromUid: currentUser.uid,
      fromName: currentProfile.name,
      toEmail: email,
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('邀請已送出,等對方登入接受 💌');
    input.value = '';
  }catch(e){
    console.error(e);
    toast('送出失敗：'+e.message);
  }
  btn.disabled = false; btn.textContent = '送出邀請';
}

async function acceptInvite(inviteId){
  const invite = pendingInvitesToMe.find(x=>x.id===inviteId);
  if(!invite) return;
  try{
    const batch = db.batch();
    const ref1 = db.collection('users').doc(invite.fromUid).collection('friends').doc(currentUser.uid);
    const ref2 = db.collection('users').doc(currentUser.uid).collection('friends').doc(invite.fromUid);
    batch.set(ref1, {since: firebase.firestore.FieldValue.serverTimestamp()});
    batch.set(ref2, {since: firebase.firestore.FieldValue.serverTimestamp()});
    batch.update(db.collection('invites').doc(inviteId), {status:'accepted'});
    await batch.commit();
    toast(`你和 ${invite.fromName} 現在是好友了 🎉`);
  }catch(e){
    console.error(e);
    toast('操作失敗：'+e.message);
  }
}

async function declineInvite(inviteId){
  try{
    await db.collection('invites').doc(inviteId).update({status:'declined'});
  }catch(e){
    toast('操作失敗：'+e.message);
  }
}

async function revokeInvite(inviteId){
  try{
    await db.collection('invites').doc(inviteId).delete();
    toast('已收回邀請');
  }catch(e){
    toast('操作失敗：'+e.message);
  }
}

async function removeFriend(otherUid, otherName){
  if(!confirm(`確定要把「${otherName}」從好友移除嗎？之後就不會再看到彼此的紀錄了。`)) return;
  try{
    const batch = db.batch();
    batch.delete(db.collection('users').doc(currentUser.uid).collection('friends').doc(otherUid));
    batch.delete(db.collection('users').doc(otherUid).collection('friends').doc(currentUser.uid));
    await batch.commit();
    toast('已移除好友');
  }catch(e){
    console.error(e);
    toast('操作失敗：'+e.message);
  }
}

function handlePhotoSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 800;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      photoDataUrl = canvas.toDataURL('image/jpeg', 0.6);
      const box = document.getElementById('photoBox');
      box.classList.add('has-img');
      box.innerHTML = `<img src="${photoDataUrl}"><button class="photo-remove" id="removePhoto">✕</button>`;
      document.getElementById('removePhoto').onclick = (ev2)=>{
        ev2.stopPropagation();
        photoDataUrl = null;
        box.classList.remove('has-img');
        box.innerHTML = `<div class="placeholder"><span class="ic">📷</span>點一下拍照或選擇照片</div>`;
      };
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

    type:'meal',
    uid: currentUser.uid,
    name: currentProfile.name,
    date, mealType: document.getElementById('f_mealtype').value,
    dinner,
    calories: num('f_cal'), protein: num('f_protein'), carb: num('f_carb'),
    fat: num('f_fat'), fiber: num('f_fiber'), sugar: num('f_sugar'), sodium: num('f_sodium'),

  };
  try{

function renderHistoryPage(){
  const page = document.getElementById('page');
  const myEntries = visibleEntries();
  if(myEntries.length===0){
    page.innerHTML = `<div class="empty-state"><span class="ic">🍽️</span>還沒有任何紀錄<br>去「新增紀錄」寫下今天的第一筆吧</div>`;
    return;
  }
  const rosterNames = visibleUsers().map(u=>u.name).filter(Boolean);
  const entryNames = myEntries.map(e=>e.name).filter(Boolean);
  const allNames = [...new Set([...rosterNames, ...entryNames])];

  const personBar = `
    <div class="person-filter">
      <button class="chip ${!historyFilterPerson?'active':''}" data-person="">全部</button>
      ${allNames.map(n=>`<button class="chip ${historyFilterPerson===n?'active':''}" data-person="${esc(n)}" style="${historyFilterPerson===n?`background:${nameColor(n)};border-color:${nameColor(n)}`:''}">${esc(n)}</button>`).join('')}
    </div>
  `;
  const filterBar = `
    <div class="history-filter">
      <div class="date-wrap" style="flex:1;"><input type="date" id="historyDate" value="${historyFilterDate}"></div>
      ${historyFilterDate ? `<button id="clearFilter" class="filter-clear">清除</button>` : ''}
    </div>
  `;
  let filtered = myEntries;
  if(historyFilterDate) filtered = filtered.filter(e=>e.date===historyFilterDate);
  if(historyFilterPerson) filtered = filtered.filter(e=>e.name===historyFilterPerson);

  if(filtered.length===0){
    page.innerHTML = `<div class="section-title">歷史紀錄</div>` + personBar + filterBar +
      `<div class="empty-state"><span class="ic">📅</span>沒有符合條件的紀錄</div>`;
    bindHistoryFilter();
    return;
  }

  const byDate = {};
  filtered.forEach(e=>{ (byDate[e.date] = byDate[e.date]||[]).push(e); });
  const dates = Object.keys(byDate).sort((a,b)=>b.localeCompare(a));
  page.innerHTML = `<div class="section-title">歷史紀錄</div>` + personBar + filterBar + dates.map(date=>`
    <div class="day-group">
      <div class="day-label">${formatDate(date)}</div>
      ${byDate[date].map(entryCard).join('')}
    </div>
  `).join('');
  page.querySelectorAll('.del-btn').forEach(b=>{
    b.onclick = ()=>deleteEntry(b.dataset.id);
  });
  page.querySelectorAll('.edit-btn').forEach(b=>{
    b.onclick = ()=>{
      const entry = allEntries.find(x=>x.id===b.dataset.id);
      if(!entry) return;
      editingEntry = entry;
      addType = entry.type || 'meal';
      activeTab = 'add';
      renderApp();
    };
  });
  bindHistoryFilter();
}

function bindHistoryFilter(){
  const input = document.getElementById('historyDate');
  if(input){
    input.onchange = ()=>{ historyFilterDate = input.value; renderHistoryPage(); };
  }
  const clearBtn = document.getElementById('clearFilter');
  if(clearBtn){
    clearBtn.onclick = ()=>{ historyFilterDate=''; renderHistoryPage(); };
  }
  document.querySelectorAll('.person-filter .chip').forEach(b=>{
    b.onclick = ()=>{ historyFilterPerson = b.dataset.person; renderHistoryPage(); };
  });
}

function formatDate(d){
  const dt = new Date(d+'T00:00:00');
  const days = ['週日','週一','週二','週三','週四','週五','週六'];
  return `${dt.getMonth()+1}月${dt.getDate()}日 · ${days[dt.getDay()]}`;
}
function formatDateShort(d){
  const dt = new Date(d+'T00:00:00');
  return `${dt.getMonth()+1}/${dt.getDate()}`;
}

function entryCard(e){
  const mine = e.uid === currentUser.uid;
  const type = e.type || 'meal';
  let thumb, title, stats, typeLabel;

  if(type==='meal'){
    thumb = e.photo ? `<img class="entry-thumb" src="${e.photo}">` : `<div class="entry-thumb empty">🍚</div>`;
    typeLabel = `<span class="type-tag meal">${esc(e.mealType||'餐點')}</span>${e.qty ? `<span class="type-tag qty">×${e.qty}</span>` : ''}`;
    title = `<div class="entry-dinner">${esc(e.dinner||'')}</div>`;
    stats = `<div class="entry-stats">
        <span><b>${e.calories||0}</b> kcal</span>
        <span>蛋白質 <b>${e.protein||0}</b>g</span>
        <span>碳水 <b>${e.carb||0}</b>g</span>
        <span>脂肪 <b>${e.fat||0}</b>g</span>
        ${e.price ? `<span>💰 <b>NT$${e.price}</b></span>` : ''}
      </div>`;
  } else if(type==='water'){
    thumb = `<div class="entry-thumb empty type-water">💧</div>`;
    typeLabel = `<span class="type-tag water">喝水</span>`;
    title = `<div class="entry-dinner">喝了 <b class="num">${e.water||0}</b> ml 水</div>`;
    stats = '';
  } else {
    thumb = `<div class="entry-thumb empty type-exercise">🏃</div>`;
    typeLabel = `<span class="type-tag exercise">運動</span>`;
    title = `<div class="entry-dinner">${esc(e.exercise||'運動')} <b class="num">${e.exerciseMin||0}</b> 分鐘</div>`;
    stats = '';
  }

  return `
    <div class="entry-card">
      ${thumb}

        <div class="entry-top">
          <span class="badge" style="background:${nameColor(e.name)+'22'};color:${nameColor(e.name)}">${esc(e.name)}</span>

function renderDashPage(){
  const page = document.getElementById('page');
  const myEntries = visibleEntries();
  const rosterNames = visibleUsers().map(u=>u.name).filter(Boolean);
  const entryNames = myEntries.map(e=>e.name).filter(Boolean);
  const allNames = [...new Set([...rosterNames, ...entryNames])];
  if(allNames.length===0){
    page.innerHTML = `<div class="empty-state"><span class="ic">◎</span>還沒有資料可以統計<br>大家開始記錄後,這裡就會顯示比較圖表</div>`;
    return;
  }
  if(dashPerson && !allNames.includes(dashPerson)) dashPerson = '';
  const names = dashPerson ? [dashPerson] : allNames;

  let scopedEntries = myEntries;
  if(dashRange==='today'){
    const t = todayStr();
    scopedEntries = myEntries.filter(e=>e.date === t);
  } else if(dashRange==='7d'){
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate()-6);
    const cutoffStr = cutoff.toISOString().slice(0,10);
    scopedEntries = myEntries.filter(e=>e.date >= cutoffStr);
  } else if(dashRange==='custom'){
    const d = dashCustomDate || todayStr();
    scopedEntries = myEntries.filter(e=>e.date === d);
  }
  if(dashPerson) scopedEntries = scopedEntries.filter(e=>e.name===dashPerson);

  const mealEntries = scopedEntries.filter(e=>(e.type||'meal')==='meal');
  const waterEntries = scopedEntries.filter(e=>e.type==='water');
  const exEntries = scopedEntries.filter(e=>e.type==='exercise');

  const blankStat = ()=>({mealCount:0, cal:0, protein:0, carb:0, fat:0, cost:0, waterByDate:{}, proteinByDate:{}, carbByDate:{}, fatByDate:{}, calByDate:{}, exmin:0});
  const stats = {};
  names.forEach(n=>stats[n] = blankStat());

  mealEntries.forEach(e=>{
    if(!stats[e.name]) stats[e.name] = blankStat();
    const s = stats[e.name];
    s.mealCount++; s.cal += (e.calories||0); s.protein += (e.protein||0);
    s.carb += (e.carb||0); s.fat += (e.fat||0); s.cost += (e.price||0);
    s.proteinByDate[e.date] = (s.proteinByDate[e.date]||0) + (e.protein||0);
    s.carbByDate[e.date] = (s.carbByDate[e.date]||0) + (e.carb||0);
    s.fatByDate[e.date] = (s.fatByDate[e.date]||0) + (e.fat||0);
    s.calByDate[e.date] = (s.calByDate[e.date]||0) + (e.calories||0);
  });
  waterEntries.forEach(e=>{
    if(!stats[e.name]) stats[e.name] = blankStat();
    const s = stats[e.name];
    s.waterByDate[e.date] = (s.waterByDate[e.date]||0) + (e.water||0);
  });
  exEntries.forEach(e=>{
    if(!stats[e.name]) stats[e.name] = blankStat();
    stats[e.name].exmin += (e.exerciseMin||0);
  });

  const avgMeal = (s,k)=> s.mealCount? Math.round(s[k]/s.mealCount):0;
  const avgWater = (s)=>{
    const days = Object.keys(s.waterByDate);
    if(days.length===0) return 0;
    const total = days.reduce((sum,d)=>sum+s.waterByDate[d],0);
    return Math.round(total/days.length);
  };
  const avgDailyMacro = (s, macroKey)=>{
    const byDate = s[macroKey+'ByDate'];
    const days = Object.keys(byDate);
    if(days.length===0) return 0;
    const total = days.reduce((sum,d)=>sum+byDate[d],0);
    return total/days.length;
  };
  const gridCols = `repeat(${Math.min(names.length,4)},1fr)`;
  const rangeLabel = dashRange==='today' ? '今天' : dashRange==='7d' ? '最近 7 天' : dashRange==='custom' ? formatDateShort(dashCustomDate||todayStr()) : '全部';
  const isDailyTotalMode = dashRange==='today' || dashRange==='custom';
  const calVals = names.map(n=> isDailyTotalMode ? stats[n].cal : avgDailyMacro(stats[n], 'cal'));
  const calMax = Math.max(200, ...calVals);
  const calTitle = dashRange==='today' ? '今日總熱量' : dashRange==='custom' ? `${rangeLabel} 總熱量` : '平均每天總熱量';
  const costMax = Math.max(100, ...names.map(m=>stats[m].cost));
  const macroMax = (macroKey)=> dashRange==='7d'
    ? Math.max(15, ...names.map(m=>avgDailyMacro(stats[m], macroKey)))
    : Math.max(15, ...names.map(m=>stats[m][macroKey]));
  const macroBlock = (label, macroKey)=>{
    const vals = names.map(n=> dashRange==='7d' ? avgDailyMacro(stats[n], macroKey) : stats[n][macroKey]);
    const max = macroMax(macroKey);
    return `
      <div class="bar-block">
        <h3>${label}</h3>
        ${names.map((n,i)=>barRow(n, vals[i], 'g', max, null, 2)).join('')}
      </div>
    `;
  };

  page.innerHTML = `
    <div class="section-title">${dashPerson? esc(dashPerson)+' 的總覽' : '大家的總覽'}</div>
    <div class="person-filter">
      <button class="chip ${!dashPerson?'active':''}" data-person="">全部</button>
      ${allNames.map(n=>`<button class="chip ${dashPerson===n?'active':''}" data-person="${esc(n)}" style="${dashPerson===n?`background:${nameColor(n)};border-color:${nameColor(n)}`:''}">${esc(n)}</button>`).join('')}
    </div>
    <div class="seg dash-range">
      <button class="${dashRange==='today'?'active':''}" data-range="today">今天</button>
      <button class="${dashRange==='7d'?'active':''}" data-range="7d">最近 7 天</button>
      <button class="${dashRange==='all'?'active':''}" data-range="all">全部紀錄</button>
      <button class="${dashRange==='custom'?'active':''}" data-range="custom">選日期</button>
    </div>
    ${dashRange==='custom' ? `
      <div class="date-wrap" style="margin-bottom:16px;box-shadow:var(--shadow);">
        <input type="date" id="dashCustomDateInput" value="${dashCustomDate||todayStr()}">
      </div>
    ` : ''}
    <div class="plate-row">
      ${names.map(n=>plateSvg(n, stats[n])).join('')}
    </div>

    ${(dashRange==='today'||dashRange==='7d'||dashRange==='custom') ? `
    <div class="section-title">${dashRange==='7d'?'平均每天三大營養素':`${rangeLabel} 三大營養素攝取`}</div>
    ${macroBlock('蛋白質 (g)', 'protein')}
    ${macroBlock('碳水化合物 (g)', 'carb')}
    ${macroBlock('脂肪 (g)', 'fat')}
    ` : ''}

    <div class="bar-block">
      <h3>${calTitle}</h3>
      ${names.map((n,i)=>barRow(n, calVals[i], 'kcal', calMax)).join('')}
    </div>

    <div class="bar-block">
      <h3>平均每日喝水量 <span class="ref-note">┊建議約 2000ml</span></h3>
      ${names.map(n=>barRow(n, avgWater(stats[n]), 'ml', 2500, 2000)).join('')}
    </div>

    <div class="bar-block">
      <h3>餐費花費</h3>
      ${names.map(n=>barRow(n, stats[n].cost, ' 元', costMax)).join('')}
    </div>

    <div class="bar-block">
      <h3>運動紀錄</h3>
      ${exEntries.length===0
        ? `<div class="ex-empty">這段期間還沒有運動紀錄</div>`
        : renderExGroups(exEntries)}
    </div>

    <div class="section-title">平均每餐營養素 (g)</div>
    <div class="stat-grid" style="grid-template-columns:${gridCols};margin-bottom:18px;">
      ${names.map(n=>`
        <div class="stat-card">
          <div class="who-name" style="color:${nameColor(n)}">${esc(n)}</div>
          <div class="big">${stats[n].mealCount? avgMeal(stats[n],'protein') : '–'}</div><div class="lbl">蛋白質 g</div>
          <div class="big" style="margin-top:6px;">${stats[n].mealCount? avgMeal(stats[n],'carb') : '–'}</div><div class="lbl">碳水 g</div>
          <div class="big" style="margin-top:6px;">${stats[n].mealCount? avgMeal(stats[n],'fat') : '–'}</div><div class="lbl">脂肪 g</div>
        </div>
      `).join('')}
    </div>
    <div style="text-align:center;font-size:11.5px;color:var(--ink-soft);padding-bottom:6px;">
      共 ${scopedEntries.length} 筆紀錄(${rangeLabel}${dashPerson? '・'+esc(dashPerson):''}) · 數字會隨新紀錄自動更新
    </div>
  `;
  page.querySelectorAll('.dash-range button').forEach(b=>{
    b.onclick = ()=>{
      dashRange = b.dataset.range;
      if(dashRange==='custom' && !dashCustomDate) dashCustomDate = todayStr();
      renderDashPage();
    };
  });
  const customDateInput = document.getElementById('dashCustomDateInput');
  if(customDateInput){
    customDateInput.onchange = ()=>{ dashCustomDate = customDateInput.value || todayStr(); renderDashPage(); };
  }
  page.querySelectorAll('.person-filter .chip').forEach(b=>{
    b.onclick = ()=>{ dashPerson = b.dataset.person; renderDashPage(); };
  });
}

function renderExGroups(exEntries){
  const byDate = {};
  exEntries.forEach(e=>{ (byDate[e.date] = byDate[e.date]||[]).push(e); });
  const dates = Object.keys(byDate).sort((a,b)=>b.localeCompare(a));
  return `<div class="ex-groups">` + dates.map(date=>`
    <div class="ex-group">
      <div class="ex-group-date">${formatDateShort(date)}</div>
      <div class="ex-group-rows">
        ${byDate[date].map(e=>`
          <div class="ex-row">
            <span class="badge" style="background:${nameColor(e.name)+'22'};color:${nameColor(e.name)}">${esc(e.name)}</span>
            <span class="ex-type">${esc(e.exercise||'運動')}</span>
            <span class="ex-min num">${e.exerciseMin||0} 分</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('') + `</div>`;
}

function barRow(name, val, unit, max, refTarget, decimals){
  const pct = max>0 ? Math.min(100, Math.round(val/max*100)) : 0;
  const refPct = refTarget ? Math.min(100, Math.round(refTarget/max*100)) : null;
  const hasData = val>0;
  const displayVal = decimals ? Number(val).toFixed(decimals) : val;
  return `
    <div class="bar-row">
      <div class="bar-head"><span class="name">${esc(name)}</span><span class="val">${hasData? displayVal+unit : '– 尚無紀錄'}</span></div>
      <div class="bar-track">
        ${refPct!==null ? `<div class="bar-ref" style="left:${refPct}%"></div>` : ''}
        <div class="bar-fill ${hasData?'':'empty'}" style="width:${pct}%;background:${nameColor(name)}"></div>
      </div>
    </div>
  `;
}

function plateSvg(name, s){
  const target = 700;
  const avgCal = s.mealCount? s.cal/s.mealCount : 0;
  const pct = Math.min(1, avgCal/target);
  const r = 34, c = 2*Math.PI*r;
  const color = nameColor(name);
  return `
    <div class="plate">
      <svg width="84" height="84">
        <circle cx="42" cy="42" r="${r}" fill="none" stroke="#E3DACB" stroke-width="7"/>
        <circle cx="42" cy="42" r="${r}" fill="none" stroke="${color}" stroke-width="7"
          stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" stroke-linecap="round"/>
      </svg>
      <div class="plate-name">${esc(name)}<b>${s.mealCount}餐</b></div>
    </div>
  `;
}

function handlePostPhotoSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      boardPhotoDataUrl = canvas.toDataURL('image/jpeg', 0.65);
      const box = document.getElementById('postPhotoBox');
      box.classList.add('has-img');
      box.innerHTML = `<img src="${boardPhotoDataUrl}"><button class="photo-remove" id="removePostPhoto">✕</button>`;
      document.getElementById('removePostPhoto').onclick = (ev2)=>{
        ev2.stopPropagation();
        boardPhotoDataUrl = null;
        box.classList.remove('has-img');
        box.innerHTML = `<div class="placeholder"><span class="ic">📷</span>加一張照片（選填）</div>`;
      };
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function submitPost(){
  const btn = document.getElementById('submitPost');
  const text = document.getElementById('post_text').value.trim();
  if(!text && !boardPhotoDataUrl){ toast('寫點文字或加張照片吧'); return; }
  btn.disabled = true; btn.textContent = '發佈中…';
  try{
    await db.collection('posts').add({
      uid: currentUser.uid,
      name: currentProfile.name,
      text, photo: boardPhotoDataUrl || null,
      likes: [],
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('已發佈 🎉');
    document.getElementById('post_text').value = '';
    boardPhotoDataUrl = null;
    const box = document.getElementById('postPhotoBox');
    if(box){
      box.classList.remove('has-img');
      box.innerHTML = `<div class="placeholder"><span class="ic">📷</span>加一張照片（選填）</div>`;
    }
  }catch(e){
    console.error(e);
    toast('發佈失敗：'+e.message);
  }
  btn.disabled = false; btn.textContent = '發佈';
}

function renderPostFeed(){
  const feed = document.getElementById('postFeed');
  if(!feed) return;
  const myPosts = visiblePosts();
  if(myPosts.length===0){
    feed.innerHTML = `<div class="empty-state"><span class="ic">💬</span>還沒有人留言<br>寫下第一句幫大家打氣的話吧</div>`;
    return;
  }
  feed.innerHTML = myPosts.map(postCard).join('');
  feed.querySelectorAll('.like-btn').forEach(b=>{
    b.onclick = ()=>toggleLike(b.dataset.id, b.dataset.liked==='1');
  });
  feed.querySelectorAll('.post-del').forEach(b=>{
    b.onclick = ()=>deletePost(b.dataset.id);
  });
  feed.querySelectorAll('.comment-toggle-btn').forEach(b=>{
    b.onclick = ()=>toggleComments(b.dataset.id);
  });
  myPosts.forEach(p=>{
    if(expandedComments[p.id]){
      const el = document.getElementById('comments-'+p.id);
      if(el) bindCommentsSectionEvents(p.id, el);
    }
  });
}

function postCard(p){
  const mine = p.uid === currentUser.uid;
  const likes = p.likes || [];
  const liked = currentUser && likes.includes(currentUser.uid);
  const initial = (p.name||'?').slice(0,1);
  const avatar = userAvatar(p.uid);
  const avatarHtml = avatar
    ? `<img class="post-avatar-img" src="${avatar}">`
    : `<div class="post-avatar" style="background:${nameColor(p.name)}">${esc(initial)}</div>`;
  const cCount = p.commentCount || 0;
  return `
    <div class="post-card">
      <div class="post-head">
        ${avatarHtml}
        <div class="post-headtext">
          <div class="post-name">${esc(p.name)}</div>
          <div class="post-time">${relativeTime(p.createdAt)}</div>
        </div>
        ${mine ? `<button class="post-del" data-id="${p.id}">刪除</button>` : ''}
      </div>
      ${p.text ? `<div class="post-text">${esc(p.text)}</div>` : ''}
      ${p.photo ? `<img class="post-photo" src="${p.photo}">` : ''}
      <div class="post-actions">
        <button class="like-btn ${liked?'liked':''}" data-id="${p.id}" data-liked="${liked?'1':'0'}">
          <span class="ic">${liked?'💪':'🤍'}</span> ${likes.length>0? '幫'+likes.length+'人打氣' : '幫TA打氣'}
        </button>
        <button class="comment-toggle-btn" data-id="${p.id}">
          <span class="ic">💬</span> ${cCount>0? cCount+' 則留言' : '留言'}
        </button>
      </div>
      ${expandedComments[p.id] ? `<div class="comments-section" id="comments-${p.id}">${renderCommentsInner(p.id)}</div>` : ''}
    </div>
  `;
}

function renderCommentsInner(postId){
  const list = commentsCache[postId];
  const listHtml = !list
    ? `<div class="comments-loading">載入留言中…</div>`
    : list.length===0
      ? `<div class="comments-empty">還沒有留言,第一個留言吧</div>`
      : list.map(c=>commentRow(postId,c)).join('');
  return `
    <div class="comments-list">${listHtml}</div>
    <div class="comment-compose">
      <input type="text" class="comment-input" data-post="${postId}" placeholder="留言幫大家打氣…" maxlength="200">
      <button class="comment-send" data-post="${postId}">送出</button>
    </div>
  `;
}

function commentRow(postId, c){
  const mine = c.uid === currentUser.uid;
  return `
    <div class="comment-row">
      <span class="comment-name" style="color:${nameColor(c.name)}">${esc(c.name)}</span>
      <span class="comment-text">${esc(c.text)}</span>
      ${mine ? `<button class="comment-del" data-post="${postId}" data-id="${c.id}">✕</button>` : ''}
    </div>
  `;
}

function bindCommentsSectionEvents(postId, el){
  const sendBtn = el.querySelector('.comment-send');
  const input = el.querySelector('.comment-input');
  if(sendBtn) sendBtn.onclick = ()=>submitComment(postId, input);
  if(input) input.onkeydown = (ev)=>{ if(ev.key==='Enter') submitComment(postId, input); };
  el.querySelectorAll('.comment-del').forEach(b=>{
    b.onclick = ()=>deleteComment(b.dataset.post, b.dataset.id);
  });
}

function toggleComments(postId){
  if(expandedComments[postId]){
    expandedComments[postId] = false;
    if(commentUnsubs[postId]){ commentUnsubs[postId](); delete commentUnsubs[postId]; }
  } else {
    expandedComments[postId] = true;
    listenComments(postId);
  }
  renderPostFeed();
}

function listenComments(postId){
  if(commentUnsubs[postId]) return;
  commentUnsubs[postId] = db.collection('posts').doc(postId).collection('comments')
    .orderBy('createdAt','asc').limit(300)
    .onSnapshot(snap=>{
      commentsCache[postId] = snap.docs.map(d=>({id:d.id, ...d.data()}));
      const el = document.getElementById('comments-'+postId);
      if(el){
        el.innerHTML = renderCommentsInner(postId);
        bindCommentsSectionEvents(postId, el);
      }
    }, err=>console.error(err));
}

async function submitComment(postId, input){
  const text = input.value.trim();
  if(!text) return;
  input.disabled = true;
  try{
    await db.collection('posts').doc(postId).collection('comments').add({
      uid: currentUser.uid, name: currentProfile.name, text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('posts').doc(postId).update({
      commentCount: firebase.firestore.FieldValue.increment(1)
    });
    input.value = '';
  }catch(e){
    toast('留言失敗：'+e.message);
  }
  input.disabled = false;
  input.focus();
}

async function deleteComment(postId, commentId){
  if(!confirm('確定要刪除這則留言嗎？')) return;
  try{
    await db.collection('posts').doc(postId).collection('comments').doc(commentId).delete();
    await db.collection('posts').doc(postId).update({
      commentCount: firebase.firestore.FieldValue.increment(-1)
    });
  }catch(e){
    toast('刪除失敗：'+e.message);
  }
}

function relativeTime(ts){
  if(!ts || !ts.toDate) return '剛剛';
  const diffMs = Date.now() - ts.toDate().getTime();
  const min = Math.floor(diffMs/60000);
  if(min < 1) return '剛剛';
  if(min < 60) return `${min} 分鐘前`;
  const hr = Math.floor(min/60);
  if(hr < 24) return `${hr} 小時前`;
  const day = Math.floor(hr/24);
  if(day < 7) return `${day} 天前`;
  const d = ts.toDate();
  return `${d.getMonth()+1}/${d.getDate()}`;
}

async function toggleLike(id, currentlyLiked){
  try{
    await db.collection('posts').doc(id).update({
      likes: currentlyLiked
        ? firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
        : firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
    });
  }catch(e){
    toast('操作失敗：'+e.message);
  }
}

async function deletePost(id){
  if(!confirm('確定要刪除這則留言嗎？')) return;
  try{
    if(commentUnsubs[id]){ commentUnsubs[id](); delete commentUnsubs[id]; }
    await db.collection('posts').doc(id).delete();
    toast('已刪除');
  }catch(e){
    toast('刪除失敗：'+e.message);
  }
}

root.innerHTML = `<div class="loading">載入中…</div>`;
</script>
</body>
